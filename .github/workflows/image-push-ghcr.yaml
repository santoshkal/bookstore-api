name: GHCR Build and Push
on:
  push:
    branches:
      - '*'
    tags:
      - '*'
      - '!release/*'
jobs:
  ghcr:
    env:
      REGISTRY: ghcr.io
      IMAGE: santoshkal/bookstore
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: fluxcd/flux2/action@dd233c4fadef306a62b7893204f8e3817fecc2b2
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Prepare
        id: prep
        run: |
          SHORT_SHA=${GITHUB_SHA:0:8}
          VERSION=${SHORT_SHA}
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            VERSION=${GITHUB_REF_NAME}
            # fallback for older runners without GITHUB_REF_NAME
            if [ -z "$VERSION" ]; then
              VERSION=${GITHUB_REF##*/}
            fi
          fi
          BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          echo "SHORT_SHA=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "BUILD_DATE=${BUILD_DATE}" >> $GITHUB_OUTPUT
          # backward compat aliases
          echo "BUILD_ID=${VERSION}" >> $GITHUB_OUTPUT
          echo "LATEST_ID=latest" >> $GITHUB_OUTPUT
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to Github Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          build-args: |
            COMMIT_SHA=${{ steps.prep.outputs.SHORT_SHA }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ steps.prep.outputs.VERSION }}
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          artifact-name: sbom_bookstore-${{ steps.prep.outputs.VERSION }}.spdx.json
          output-file: ./sbom_bookstore-${{ steps.prep.outputs.VERSION }}.spdx.json
          image: ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ steps.prep.outputs.VERSION }}
          upload-release-assets: false
      - name: Sign Container Image
        shell: bash
        run: |
          # Function to retry cosign signing with exponential backoff (from cilium/cilium/.github/actions/cosign/action.yaml)
          sign_with_retry() {
            local image="$1"
            local max_attempts=5
            local delay=10
            for attempt in $(seq 1 $max_attempts); do
              echo "Attempt $attempt/$max_attempts: Signing $image"
              if cosign sign -y "$image"; then
                echo "Successfully signed $image"
                return 0
              else
                echo "Failed to sign $image (attempt $attempt/$max_attempts)"
                if [ $attempt -lt $max_attempts ]; then
                  echo "Waiting ${delay}s before retry..."
                  sleep $delay
                  delay=$((delay * 2))
                fi
              fi
            done
            echo "ERROR: Failed to sign $image after $max_attempts attempts"
            return 1
          }
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE }}@${{ steps.docker_build.outputs.digest }}"
          sign_with_retry "$IMAGE"
      - name: Attach SBOM Attestation
        shell: bash
        run: |
          # Function to retry cosign attestation with exponential backoff (from cilium/cilium/.github/actions/cosign/action.yaml)
          attest_with_retry() {
            local predicate="$1"
            local image="$2"
            local max_attempts=5
            local delay=10
            for attempt in $(seq 1 $max_attempts); do
              echo "Attempt $attempt/$max_attempts: Attesting $image with $predicate"
              if cosign attest -y --predicate "$predicate" --type spdxjson "$image"; then
                echo "Successfully attested $image"
                return 0
              else
                echo "Failed to attest $image (attempt $attempt/$max_attempts)"
                if [ $attempt -lt $max_attempts ]; then
                  echo "Waiting ${delay}s before retry..."
                  sleep $delay
                  delay=$((delay * 2))
                fi
              fi
            done
            echo "ERROR: Failed to attest $image after $max_attempts attempts"
            return 1
          }
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE }}@${{ steps.docker_build.outputs.digest }}"
          SBOM_FILE="./sbom_bookstore-${{ steps.prep.outputs.VERSION }}.spdx.json"
          attest_with_retry "$SBOM_FILE" "$IMAGE"
      - name: Publish Flux OCI artifact to GHCR
        id: Push_Artifact
        run: |
          flux push artifact oci://ghcr.io/santoshkal/manifests/bookstore:${{ steps.prep.outputs.VERSION }} \
            --path="./kustomize" \
            --source="${{ github.event.repository.html_url }}" \
            --revision="${GITHUB_REF_NAME}@sha1:${GITHUB_SHA}"
          flux tag artifact oci://ghcr.io/santoshkal/manifests/bookstore:${{ steps.prep.outputs.VERSION }} --tag latest
      - name: Image digest
        run: echo ${{ steps.prep.outputs.VERSION }}
    # - name: Metadata
    #   run: echo ${}
