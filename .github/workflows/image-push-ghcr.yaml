name: GHCR Build and Push
on:
  push:
    branches:
      - '*'
    tags-ignore:
      - 'release/*'
jobs:
  ghcr:
    env:
      REGISTRY: ghcr.io
      IMAGE: santoshkal/bookstore
      COMMIT_SHA: ${{github.sha}}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: fluxcd/flux2/action@main
      - uses: actions/checkout@v7
      - name: Set environment variable
        id: var
        run: |
          COMMIT_SHA=$(git rev-parse --short HEAD)
          echo "COMMIT_SHA=$COMMIT_SHA" >> $GITHUB_ENV
      - name: Prepare
        id: prep
        run: "BRANCH=${GITHUB_REF##*/}\nTS=$(date +%s)\nREVISION=${GITHUB_SHA::8}\nBUILD_ID=\"${REVISION}-${TS}\"\nLATEST_ID=latest\nif [[ $GITHUB_REF == refs/tags/* ]]; then\n  BUILD_ID=${GITHUB_REF/refs\\/tags\\//}\nfi\necho ::set-output name=BUILD_DATE::$(date -u +'%Y-%m-%dT%H:%M:%SZ')\necho ::set-output name=BUILD_ID::${BUILD_ID}\necho ::set-output name=LATEST_ID::${LATEST_ID}          \n"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to Github Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set commit SHA
        id: set_commit_sha
        run: echo "::set-output name=COMMIT_SHA::$(git rev-parse --short HEAD)"
      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v7
        with:
          context: .
          build-args: |
            COMMIT_SHA=${{ env.COMMIT_SHA }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ steps.prep.outputs.LATEST_ID }}
      - name: Publish Flux OCI artifact to GHCR
        id: Push_Artifact
        run: |
          flux push artifact oci://ghcr.io/santoshkal/manifests/bookstore:${{ steps.prep.outputs.VERSION }} \
            --path="./kustomize" \
            --source="${{ github.event.repository.html_url }}" \
            --revision="${GITHUB_REF_NAME}/${GITHUB_SHA}"
          flux tag artifact oci://ghcr.io/santoshkal/manifests/bookstore:${{ steps.prep.outputs.VERSION }} --tag latest
      - name: Image digest
        run: echo $COMMIT_SHA
    # - name: Metadata
    #   run: echo ${}
